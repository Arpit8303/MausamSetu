version: '3.8'

services:
  # 1. PostgreSQL with PostGIS extension
  db:
    image: postgis/postgis:15-3.3
    container_name: meghsetu_db
    restart: always
    environment:
      POSTGRES_DB: meghsetu_db
      POSTGRES_USER: meghsetu_user
      POSTGRES_PASSWORD: meghsetu_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meghsetu_user -d meghsetu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: meghsetu_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Python FastAPI Backend & ML Downscaling Engine
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: meghsetu_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://meghsetu_user:meghsetu_secure_password@db:5432/meghsetu_db
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Next.js Frontend App
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: meghsetu_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
